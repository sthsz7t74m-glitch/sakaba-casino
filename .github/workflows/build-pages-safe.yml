name: Build GitHub Pages Safe

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:
  schedule:
    - cron: "20 18 * * *"

permissions:
  contents: write

concurrency:
  group: github-pages-build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Install dependencies
        run: npm ci

      - name: Generate large Japanese dictionary
        run: |
          python3 scripts/generate-japanese-dictionary.py
          test -s app/word-data-jmdict.generated.ts
          DICTIONARY_LINES=$(wc -l < app/word-data-jmdict.generated.ts)
          echo "Generated dictionary lines: ${DICTIONARY_LINES}"
          test "${DICTIONARY_LINES}" -gt 25000
          grep -q 'export const jmdictWordTuples' app/word-data-jmdict.generated.ts

      - name: Build GitHub Pages
        run: npm run build:github

      - name: Verify generated docs
        run: |
          test -f docs/index.html
          touch docs/.nojekyll
          JS_FILE=$(find docs/assets -maxdepth 1 -name 'index-*.js' | head -1)
          test -n "${JS_FILE}"
          JS_BYTES=$(wc -c < "${JS_FILE}")
          echo "Generated JavaScript bytes: ${JS_BYTES}"
          test "${JS_BYTES}" -gt 1000000
          grep -q 'v1.5.1' "${JS_FILE}"
          echo "Generated docs:"
          find docs -maxdepth 2 -type f | sort | head -50

      - name: Commit generated Pages files safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "GitHub Pagesをv1.5.1大規模辞書版へ更新"
          git pull --rebase origin main
          git push origin HEAD:main
